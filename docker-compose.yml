# Yapp — self-hosted voice tonality & yapping stamina trainer.
#   cp .env.example .env   # then set APP_PASSWORD_HASH (npm --prefix web run hash-password)
#   docker compose up -d --build
#   (no GPU, e.g. CI/sandbox: add  -f docker-compose.yml -f docker-compose.cpu.yml)
#   open http://<lan-ip>:8080 → install the CA → continue to https://<lan-ip>:8443
services:
  web:
    build: ./web
    restart: always
    # Host networking: the cert gets the machine's real LAN IPs (auto-detected), and the
    # host's Ollama is reachable on 127.0.0.1 without exposing it to the network.
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      HOSTNAMES: ${HOSTNAMES:-}
      LAN_IPS: ${LAN_IPS:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:yapp@example.com}
      DATA_DIR: /data
      CERT_DIR: /data/certs
      PORT: ${HTTPS_PORT:-8443}
      HTTP_PORT: ${HTTP_PORT:-8080}
      VOICE_LAB_URL: http://127.0.0.1:${VOICE_LAB_PORT:-8765}
      VOICE_LAB_DATA_DIR: /data
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      TZ: ${TZ:-UTC}
      HOST: ${BIND_HOST:-0.0.0.0}
    volumes:
      - ./data:/data
    # To serve on 80/443 instead of 8080/8443, set HTTP_PORT=80 HTTPS_PORT=443 in .env and either
    # run `sudo sysctl net.ipv4.ip_unprivileged_port_start=80` on the host, or uncomment:
    # user: root
    depends_on:
      voice-lab:
        condition: service_started

  voice-lab:
    build: ./voice-lab
    restart: always
    ports:
      - "127.0.0.1:${VOICE_LAB_PORT:-8765}:8000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_CACHE: /data/models
      HF_HOME: /data/models/hf
    volumes:
      - ./data:/data
    gpus: all
